name: Tests and static checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Python compile check
        run: python -m compileall -q agents katz_sodium.py cli.py enrichment.py simulator.py
      - name: Run pytest
        run: python -m pytest -q
      - name: Validate browser JavaScript
        run: |
          node --check web/app.js
          node tests/browser_smoke.cjs
