 services:
  katz-hyperglycemia-sodium-corrector:
    build: .
    container_name: katz-hyperglycemia-sodium-corrector
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:?Set a unique secret for the audit trail}
      - MODEL_PROVIDER=mock
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
