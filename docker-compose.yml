version: '3.8'

services:
  katz-hyperglycemia-sodium-corrector:
    build: .
    container_name: katz-hyperglycemia-sodium-corrector
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=katz-hyperglycemia-sodium-corrector-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
